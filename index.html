<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annapurna – Ghar ka fresh khana</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbe9da;--bg2:#f6d9c0;--card:#fff8f1;--maroon:#8a2a1f;--maroon-d:#6f1f16;--ink:#3b1d16;--muted:#5a3a30;--line:rgba(138,42,31,.18);--chip:#f5dcc6;--brass:#b8873a;--serif:"Newsreader",Georgia,serif;--sans:"Outfit",system-ui,sans-serif;--pad:clamp(20px,5vw,80px)}
[data-theme=dark]{--bg:#1d1411;--bg2:#251915;--card:#32221c;--ink:#f5e4d6;--muted:#d1b5a4;--line:rgba(245,220,198,.2);--chip:#3f2b23;--maroon:#c4503f;--maroon-d:#a53f30}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--maroon);color:#fff;font-weight:500;border-radius:999px;min-height:44px;padding:0 26px;transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{background:var(--maroon-d);transform:translateY(-2px);box-shadow:0 10px 24px rgba(138,42,31,.28)}.btn.alt{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.lnk{text-decoration:underline;min-height:44px;color:var(--muted)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hint{font-size:.85rem;color:var(--muted)}
/* HERO – colours are fixed to the light palette so dark mode doesn't affect it */
.hero{--bg:#fbe9da;--bg-deep:#f6d9c0;--maroon:#8a2a1f;--maroon-dark:#6f1f16;--ink:#3b1d16;--line:rgba(138,42,31,.15);--chip:#f5dcc6;--leaf:#5b6b32;
 position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;color:var(--ink);background:linear-gradient(100deg,#fdeee0 0%,var(--bg) 45%,var(--bg-deep) 100%)}
/* Laptop/tablet image: hero.png  |  Phone image: "phone hero.png" (same folder) */
.hero-media{position:absolute;inset:0;background:var(--hero-img,url("hero.png")) right bottom/cover no-repeat;z-index:0}
/* STEAM */
.steam{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.steam-m{display:none}
.wisp{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:rise 7s ease-out infinite}
.wm{animation-name:risem}
.w1{animation-delay:0s}
.w2{animation-delay:2.3s;animation-duration:8s}
.w3{animation-delay:4.6s;animation-duration:7.5s}
.w4{animation-delay:1.2s;animation-duration:6.5s}
.w5{animation-delay:3.4s;animation-duration:6.5s}
@keyframes rise{
  0%   {opacity:0;   transform:translateY(20px) scale(.7, .6)}
  20%  {opacity:.6}
  60%  {opacity:.38}
  100% {opacity:0;   transform:translateY(-120px) scale(1.7, 1.15)}
}
/* smaller travel for the phone steam (the phone SVG is a smaller coordinate space) */
@keyframes risem{
  0%   {opacity:0;   transform:translateY(12px) scale(.7, .6)}
  20%  {opacity:.65}
  60%  {opacity:.4}
  100% {opacity:0;   transform:translateY(-70px) scale(1.6, 1.15)}
}
@media(prefers-reduced-motion:reduce){.wisp{animation:none;opacity:.2}}
.nav{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:0 var(--pad);padding:22px 0;border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.75rem;font-weight:500;color:var(--maroon-dark)}.logo svg,.logo img{width:40px;height:40px;object-fit:contain}
.links{display:flex;gap:clamp(24px,3.4vw,52px);list-style:none}
.links button{font-size:1rem;font-weight:500;padding:8px 2px;position:relative;min-height:44px;color:var(--ink)}
.links button::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:2px;background:var(--maroon);transform:scaleX(0);transition:transform .25s;transform-origin:left}.links button:hover::after{transform:scaleX(1)}
.nav .btn{justify-self:end}
/* hamburger (phone / small tablet only) */
.menu-btn{display:none;justify-self:end;width:44px;height:44px;align-items:center;justify-content:center;color:var(--maroon)}
.menu-btn svg{width:32px;height:32px}
.mnav{display:none;position:absolute;top:100%;right:0;margin-top:8px;min-width:200px;flex-direction:column;background:#fff8f1;border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 14px 30px rgba(138,42,31,.16)}
.mnav button{min-height:46px;padding:0 16px;text-align:left;font-weight:500;color:var(--ink);border-radius:12px}
.mnav button:hover{background:var(--chip)}
.nav.open .mnav{display:flex}
.btn-sm{padding:0 30px;font-size:1rem}.btn-lg{padding:20px 38px;font-size:1.2rem;gap:14px}
.btn svg{width:24px;height:24px;transition:transform .2s}.btn:hover svg{transform:translateX(4px)}
.content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;margin:0 var(--pad);padding:clamp(32px,6vh,72px) 0 clamp(48px,8vh,96px);max-width:720px}
h1{font-family:var(--serif);font-weight:600;color:var(--maroon);font-size:clamp(3.2rem,7.2vw,6.4rem);line-height:1.02;letter-spacing:-.02em}
.sub{position:relative;display:inline-block;align-self:flex-start;font-family:var(--serif);font-style:italic;font-weight:400;color:var(--maroon);font-size:clamp(1.6rem,3.2vw,2.6rem);margin-top:clamp(14px,2.4vh,26px)}
.sub svg{position:absolute;left:38%;right:0;bottom:-14px;width:62%;height:14px}
.features{display:flex;align-items:center;gap:clamp(18px,2.4vw,36px);margin-top:clamp(32px,6vh,56px);flex-wrap:wrap}
.feature{display:flex;align-items:center;gap:16px;font-size:1.05rem;line-height:1.35;color:var(--ink)}
.feature .ic{flex:none;width:60px;height:60px;border-radius:50%;background:var(--chip);display:grid;place-items:center}.feature .ic svg{width:30px;height:30px}
.divider{width:1px;height:52px;background:var(--line)}.cta{margin-top:clamp(32px,6vh,52px);align-self:flex-start}
@media(max-width:960px){.nav{grid-template-columns:1fr auto auto}.links{display:none}.menu-btn{display:inline-flex}.hero-media{background-position:75% bottom}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(251,233,218,.92) 0%,rgba(251,233,218,.6) 55%,rgba(251,233,218,0) 100%);z-index:0;pointer-events:none}.divider{display:none}}

/* ===== PHONE HERO – matches the mobile UI mock ===== */
@media(max-width:640px){
  .hero{min-height:100vh;min-height:100svh}
  .hero-media{background:var(--hero-img-m,url("phone hero.png")) center bottom/cover no-repeat}
  .hero::after{display:none}
  .steam-d{display:none}
  .steam-m{display:block}
  .nav{margin:0;padding:16px 20px;grid-template-columns:1fr auto}
  .nav>.btn-sm{display:none}
  .mnav{right:12px}
  .logo{font-size:1.55rem;gap:8px}.logo svg,.logo img{width:34px;height:34px}
  .content{max-width:none;margin:0;padding:clamp(28px,6.5vh,60px) 20px 0;justify-content:flex-start;flex:none}
  h1{font-size:clamp(3rem,13.6vw,4.2rem);line-height:1}
  .sub{font-size:clamp(1.4rem,6.6vw,2rem);margin-top:clamp(14px,2.4vh,22px)}
  .sub svg{bottom:-12px;height:12px}
  .features{flex-wrap:nowrap;flex-direction:row;align-items:center;gap:clamp(10px,3vw,18px);margin-top:clamp(28px,4.6vh,44px)}
  .feature{gap:10px;font-size:clamp(.78rem,3.5vw,.98rem);line-height:1.3}
  .feature .ic{width:clamp(40px,11vw,52px);height:clamp(40px,11vw,52px)}
  .feature .ic svg{width:55%;height:55%}
  .divider{display:block;height:40px;flex:none}
  .btn-lg{padding:0 30px;min-height:54px;font-size:1.1rem;gap:12px}
  .btn-lg svg{width:22px;height:22px}
  .cta{width:auto;margin-top:clamp(24px,4vh,40px)}
}
@media(max-width:380px){.logo{font-size:1.35rem}.feature{font-size:.74rem}}

/* BUILDER */
#builder{background:url("order.png") center/cover no-repeat,linear-gradient(135deg,#fdeee0,#fbe9da 50%,#f6d9c0);padding:0 var(--pad) 56px;min-height:100vh;color:#3b1d16;scroll-margin-top:0}
[data-theme=dark] #builder{background:var(--bg2);color:var(--ink)}

/* Smooth entrance transition when clicking Order Now */
@keyframes sectionReveal{
  from{opacity:0;transform:translateY(28px)}
  to{opacity:1;transform:translateY(0)}
}
#builder.entering .bnav,
#builder.entering h2,
#builder.entering .panel,
#builder.entering #menu{
  animation:sectionReveal .75s cubic-bezier(.22,1,.36,1) both;
}
#builder.entering h2{animation-delay:.08s}
#builder.entering .panel{animation-delay:.16s}
#builder.entering #menu{animation-delay:.24s}

.bnav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px var(--pad);border-bottom:1px solid var(--line);margin:0 calc(var(--pad)*-1) 28px;flex-wrap:wrap}
.bnav .logo{font-family:var(--serif);font-size:1.75rem;font-weight:500;color:var(--maroon-d)}
.bnav .btn.alt{background:rgba(245,220,198,.7);box-shadow:0 2px 8px rgba(138,42,31,.1)}
[data-theme=dark] .bnav .btn.alt{background:var(--chip)}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,4.5vw,3.4rem);color:#5a1a12;margin:0 0 24px;padding-left:clamp(0px,2vw,32px)}
[data-theme=dark] #builder h2{color:var(--ink)}
.cols{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:32px;align-items:start}
.panel{position:sticky;top:12px;background:rgba(255,248,241,.85);border:1px solid var(--line);border-radius:36px;padding:28px 28px 22px;text-align:center;box-shadow:0 10px 30px rgba(138,42,31,.08)}
[data-theme=dark] .panel{background:var(--card)}
.panel h3{font-family:var(--serif);font-size:1.7rem;font-weight:600;color:#5a1a12}
[data-theme=dark] .panel h3{color:var(--ink)}
.plate-wrap{position:relative;width:100%;max-width:340px;margin:16px auto 22px}
.plate{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#e8c27a 0 48%,#c9a04f 52%,#8c6428 100%) center/cover;box-shadow:0 14px 30px rgba(120,80,20,.3),inset 0 0 0 6px rgba(255,240,200,.45)}
.d{position:absolute;aspect-ratio:1;overflow:visible}
.d>img,.d>i{width:100%;height:100%;display:block}
.d>img{object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.d>i{border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.d.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.2);opacity:0}}
.badge{position:absolute;right:-4px;top:-4px;background:var(--maroon);color:#fff;border-radius:99px;min-width:24px;height:24px;font-size:.8rem;display:grid;place-items:center;z-index:3}
.empty{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-style:italic;color:#fff;font-size:1.1rem;padding:20%}
.macros{display:flex;align-items:center;justify-content:center;gap:28px;padding:6px 0 18px;border-bottom:1px solid var(--line)}
.mac{display:flex;align-items:center;gap:12px;text-align:left}
.mac .mi{font-size:2rem;line-height:1}
.mac small{display:block;font-size:.85rem;color:var(--muted)}
.mac b{font-size:1.5rem;font-weight:500;line-height:1.1}
.mdiv{width:1px;height:44px;background:var(--line)}
.tot{display:flex;justify-content:space-between;font-family:var(--serif);font-size:1.6rem;font-weight:600;margin:16px 4px}
.panel .btn{width:100%;min-height:54px;font-size:1.05rem}
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.tab{min-height:44px;padding:0 24px;border-radius:999px;background:rgba(255,248,241,.85);box-shadow:0 2px 8px rgba(138,42,31,.1);font-weight:500;transition:background .25s,color .25s,transform .2s}
[data-theme=dark] .tab{background:var(--chip)}
.tab[aria-selected=true]{background:linear-gradient(#b8432f,#8a2a1f);color:#fff}
.banner{background:var(--card);border:1px solid var(--brass);border-radius:18px;padding:14px 18px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.banner b{font-family:var(--serif);font-size:1.25rem}
.grid{min-height:460px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;align-content:start}
.card{position:relative;background:rgba(255,248,241,.9);border:1px solid var(--line);border-radius:24px;padding:16px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(138,42,31,.07);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(138,42,31,.12)}
[data-theme=dark] .card{background:var(--card)}
.bowl{width:82%;aspect-ratio:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.bowl>img,.bowl>i{width:100%;height:100%;display:block}.bowl>img{object-fit:contain}.bowl>i{border-radius:50%}
i.ph{background:var(--c)}
.nm{font-weight:500;display:flex;gap:6px;align-items:center;justify-content:center}.pr{color:var(--maroon);font-weight:600;font-size:1.1rem}
.vg{width:14px;height:14px;border:2px solid #2e7d32;display:inline-grid;place-items:center;flex:none}.vg::after{content:"";width:6px;height:6px;border-radius:50%;background:#2e7d32}.vg.n{border-color:#b3261e}.vg.n::after{background:#b3261e}
.add{min-height:44px;width:100%;border-radius:999px;border:1.5px solid var(--maroon);color:var(--maroon);font-weight:600;transition:background .2s,color .2s}.add.on{background:var(--maroon);color:#fff}
.step{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px}.step button{width:44px;height:44px;border-radius:50%;background:var(--maroon);color:#fff;font-size:1.4rem}
.note{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}#toast.on{opacity:1}
/* mobile-only pieces are hidden on laptop/tablet */
.back-m,.cbar,.know,.kbtn,.mandala,.ti,.tl-short,.pl,.add.mb,.step.mb{display:none}
.gbtn{gap:6px}
@media(max-width:860px){.cols{grid-template-columns:1fr}.panel{z-index:5;padding:18px}.plate{max-width:240px}.macros{gap:16px}.mac b{font-size:1.25rem}}

/* ===== PHONE ORDER SECTION – matches the mobile UI mock =====
   Background image for phone: "phone order.png" (same folder) */
@media(max-width:640px){
  #builder{background:var(--order-img-m,url("phone order.png")) center top/cover no-repeat,linear-gradient(180deg,#fdeee0,#f6d9c0);
    padding:0 16px 120px;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  /* top bar: back | logo | actions */
  .bnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0 -16px;padding:12px 16px 6px;border-bottom:0;flex:none}
  .back-m{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,248,241,.92);box-shadow:0 2px 8px rgba(138,42,31,.14);color:var(--maroon);justify-self:start}
  .back-m svg{width:20px;height:20px}
  .bnav .logo{flex-direction:column;gap:0;font-size:1.3rem;line-height:1.2}
  .bnav .logo svg{width:30px;height:30px}
  .bnav .logo img{width:30px!important;height:30px!important}
  .bnav .logo::after{content:"";width:110px;height:8px;margin-top:4px;background:radial-gradient(circle,var(--brass) 0 2px,transparent 2.5px) center/8px 8px no-repeat,linear-gradient(90deg,transparent,rgba(184,135,58,.55),transparent) center/100% 1px no-repeat}
  .bnav .acts{justify-self:end;flex-wrap:nowrap;gap:8px}
  .bnav .btn{padding:0;width:40px;min-height:40px;font-size:1.05rem;gap:0}
  .gl{display:none}
  #builder h2{text-align:center;padding:0;margin:2px 0 4px;font-size:2.1rem;line-height:1.1;text-transform:capitalize;flex:none}

  .cols{display:flex;flex-direction:column;gap:0;flex:1;min-height:0}
  .panel{position:relative;isolation:isolate;z-index:5;top:auto;flex:none;background:none;border:0;box-shadow:none;border-radius:0;padding:0}
  [data-theme=dark] .panel{background:none}
  .panel h3,.panel .tot,.panel>.btn,.panel>.lnk{display:none}

  /* plate with mandala behind it */
  .plate-wrap{--ps:min(58vw,240px);width:var(--ps);margin:16px auto 20px}
  .mandala{display:block;position:absolute;left:-16%;top:-16%;width:132%;height:132%;z-index:-1;pointer-events:none;fill:none;stroke:#c98f5f;stroke-width:.7;opacity:.45}
  [data-theme=dark] .mandala{stroke:#e0b07a;opacity:.25}
  .plate{max-width:none}
  .empty{font-size:.8rem;padding:22%}

  /* protein / carbs / Know More */
  .macros{justify-content:flex-start;gap:14px;padding:10px 12px;border:1px solid var(--line);border-radius:22px;background:rgba(255,248,241,.88);box-shadow:0 4px 14px rgba(138,42,31,.06)}
  [data-theme=dark] .macros{background:var(--card)}
  .mac{gap:8px}.mac .mi{font-size:1.5rem}.mac small{font-size:.72rem}.mac b{font-size:1.2rem}
  .mdiv{height:34px}
  .kbtn{display:inline-flex;align-items:center;gap:6px;margin-left:auto;min-height:40px;padding:0 14px;border-radius:999px;background:#f9dcc4;color:var(--maroon);font-size:.82rem;font-weight:500;white-space:nowrap}
  [data-theme=dark] .kbtn{background:var(--chip);color:var(--ink)}
  .kbtn svg{display:block;width:16px;height:16px;transition:transform .2s}.kbtn.open svg{transform:rotate(90deg)}
  .know{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:8;max-height:42vh;max-height:42svh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 14px 30px rgba(138,42,31,.18);text-align:left;color:var(--ink)}
  .know.open{display:block}
  .know ul{list-style:none;display:grid;gap:8px;margin-bottom:10px}
  .know li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:.85rem}
  .know li span:nth-child(2){color:var(--muted);font-size:.75rem}
  .know li span:last-child{font-weight:600}
  .know li.none{display:block;text-align:center;color:var(--muted)}
  .kt{display:flex;justify-content:space-between;font-family:var(--serif);font-size:1.2rem;font-weight:600;border-top:1px solid var(--line);padding-top:10px}
  .know .lnk{display:block;margin:4px auto 0;font-size:.85rem}

  /* menu: category tabs + 3-column grid */
  #menu{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:10px}
  .tabs{position:relative;flex:none;flex-wrap:nowrap;align-items:center;gap:2px;overflow-x:auto;margin:0 -16px 8px;padding:6px 16px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab,[data-theme=dark] .tab{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:0 12px;border-radius:999px;background:none;box-shadow:none;color:var(--muted);font-size:.8rem}
  .ti{display:block}.ti svg{display:block;width:24px;height:24px}
  .tl-full{display:none}.tl-short{display:inline}
  .tab[aria-selected=true],[data-theme=dark] .tab[aria-selected=true]{flex-direction:row;gap:8px;padding:0 20px;min-height:46px;font-size:.95rem;background:linear-gradient(#b8432f,#8a2a1f);color:#fff;box-shadow:0 6px 14px rgba(138,42,31,.28)}
  .tab[aria-selected=true]::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-11px;width:44px;height:3px;border-radius:3px;background:var(--maroon)}
  .banner{padding:10px 12px;border-radius:16px;margin-bottom:10px;gap:8px;flex:none}
  .banner b{font-size:1rem}
  .banner .btn{min-height:36px;padding:0 14px;font-size:.85rem}

  .grid{min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:2px 2px 8px}
  .card,[data-theme=dark] .card{border-radius:18px;padding:10px 6px;gap:3px;box-shadow:none;border:1px solid rgba(138,42,31,.1)}

<script>
/* Optional: paste a full "data:image/jpeg;base64,..." string to embed the hero images.
   If left empty, hero.png (laptop) and "phone hero.png" (phone) from the same folder are used. */
const HERO="";
const HERO_MOBILE="";

/* ============ Helpers ============ */
const $=(s,r=document)=>r.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)};
const hue=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7)%360;

/* Custom smooth scroll with cubic ease-in-out so it never snaps instantly */
let scrollAnimId=null;
function smoothScrollTo(targetY,duration=850){
  if(scrollAnimId)cancelAnimationFrame(scrollAnimId);
  const root=document.documentElement;
  const startY=window.scrollY||window.pageYOffset;
  const diff=targetY-startY;
  if(Math.abs(diff)<2)return;
  root.classList.add('no-snap'); /* pause scroll-snap while we animate (phones) */
  let startTime=null;
  const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

  function step(timestamp){
    if(!startTime)startTime=timestamp;
    const elapsed=timestamp-startTime;
    const progress=Math.min(elapsed/duration,1);
    window.scrollTo({top:startY+diff*easeInOutCubic(progress),behavior:'instant'});
    if(progress<1){
      scrollAnimId=requestAnimationFrame(step);
    }else{
      scrollAnimId=null;
      root.classList.remove('no-snap');
    }
  }
  scrollAnimId=requestAnimationFrame(step);
}

/* Direct SVG URL resolver: maps dish name -> "<Dish Name>.svg" in the same folder.
   Replaces "/" with a space so "Millet/Quinoa" looks for "MilletQuinoa.svg". */
const svgPath=name=>encodeURI(`${String(name||'').trim().replace(/\//g,' ')}.svg`);

/* ============ STATIC MENU DATA ============ */

  'Stuffed Capsicum':[5,30],'Jeera Aloo':[3,26],'Dal Tadka':[9,20],'Dal Makhani':[11,24],

};
const nut=it=>{const n=NUTR[it.name]||[0,0];return{p:it.protein??n[0],c:it.carbs??n[1]}};

/* ============ Customer site ============ */

const LOTUS=`<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 8c3 4 5 9 5 15 0 5-2 9-5 12-3-3-5-7-5-12 0-6 2-11 5-15z" fill="#f7b9c4" stroke="#d6566f" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 33C12 32 6 27 4 19c6 0 12 3 15 9M29 33c7-1 13-6 15-14-6 0-12 3-15 9" fill="#f9cdd5" stroke="#d6566f" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 37c-5 0-9-3-11-8 5-1 9 1 12 5M33 37c5 0 9-3 11-8-5-1-9 1-12 5" stroke="#d6566f" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const ARROW=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h17M14 6l6 6-6 6"/></svg>`;
const BURGER=`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 9h24M4 16h24M4 23h24"/></svg>`;

/* faint mandala that sits behind the plate on phones */
const MANDALA=`<svg class="mandala" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="95"/><circle cx="100" cy="100" r="84"/>${Array.from({length:12},(_,i)=>`<path d="M100 3L113 28 100 53 87 28Z" transform="rotate(${i*30} 100 100)"/><path d="M100 12L108 28 100 44 92 28Z" transform="rotate(${i*30+15} 100 100)"/>`).join('')}</svg>`;

  </g></svg>
  <!-- Phone steam: coordinates match the 941x1672 phone hero image, anchored centre-bottom like the background -->
  <svg class="steam steam-m" viewBox="0 0 941 1672" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><filter id="wispm" filterUnits="userSpaceOnUse" x="0" y="820" width="941" height="640" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.014 0.030" numOctaves="3" seed="11" result="noise"><animate attributeName="baseFrequency" dur="14s" values="0.014 0.030;0.020 0.040;0.014 0.030" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="44" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="8"/></filter></defs>
  <g filter="url(#wispm)" fill="none" stroke="#fff" stroke-linecap="round">

  <nav class="nav" aria-label="Main"><a href="#top" data-act="top" class="logo" aria-label="${esc(S.name)} home">${S.logo?`<img src="${S.logo}" alt="">`:LOTUS}${esc(S.name)}</a>
  <ul class="links"><li><button data-act="soon">Our Story</button></li><li><button data-act="order">Menu</button></li><li><button data-act="soon">Kitchens</button></li><li><button data-act="soon">Plans</button></li></ul>

/* Phone: show the sticky checkout bar only while the order section is on screen */
function syncBar(){
  const b=$('#builder'),c=$('#cbar');
  if(!b||!c)return;
  const r=b.getBoundingClientRect();
  c.classList.toggle('show',r.top<innerHeight*.5&&r.bottom>innerHeight*.5);
}
addEventListener('scroll',syncBar,{passive:true});
addEventListener('resize',syncBar);

function closeKnow(){
  if(!know)return;
  know=false;
  const k=$('.know');if(k)k.classList.remove('open');
  const b=$('.kbtn');if(b){b.classList.remove('open');b.setAttribute('aria-expanded','false')}
}

const draw=()=>{if(!$('#panel'))return;drawPanel();drawMenu()};
const disc=(it,sz,x,y,cls,k)=>`<span class="d ${cls} ${lastPop==it.id+(k||'')?'pop':''}" style="width:${sz}%;left:${x-sz/2}%;top:${y-sz/2}%">${thumb(it)}</span>`;

function lines(){
  const L=[];
  cart.bowls=cart.bowls.filter(id=>getItem(id)&&getItem(id).available);
  if(cart.rice&&!(getItem(cart.rice)&&getItem(cart.rice).available))cart.rice=null;
  cart.bowls.forEach(id=>L.push([getItem(id),1]));
  if(cart.rice)L.push([getItem(cart.rice),1]);
  for(const id in cart.bread){
    if(getItem(id)&&getItem(id).available&&cart.bread[id]>0)L.push([getItem(id),cart.bread[id]]);
    else delete cart.bread[id];
  }
  return L;
}

function drawPanel(){
  const S=SETTINGS,max=+S.max||7,L=lines(),cur=S.cur||'₹',total=L.reduce((a,[i,q])=>a+i.price*q,0);
  let p='';
  const T=L.reduce((a,[i,q])=>{const n=nut(i);a.p+=n.p*q;a.c+=n.c*q;return a},{p:0,c:0});
  /* bigger katoras: 26% discs on a ring of radius 37% */
  cart.bowls.forEach((id,i)=>{const a=i/max*2*Math.PI-Math.PI/2;p+=disc(getItem(id),26,50+37*Math.cos(a),50+37*Math.sin(a),'k')});
  if(cart.rice)p+=disc(getItem(cart.rice),25,39,50,'r');
  const bk=Object.keys(cart.bread),n=bk.reduce((a,k)=>a+cart.bread[k],0);
  if(n){
    const m=Math.min(3,n);
    for(let j=0;j<m;j++)p+=disc(getItem(bk[j%bk.length]),25,61+(j-(m-1)/2)*3.5,50-(j-(m-1)/2)*3.5,'b',bk[j%bk.length]);
    p+=`<span class="badge" style="position:absolute;left:72%;top:34%">${n}</span>`;
  }
  if(!L.length)p+=`<div class="empty">Tap a dish to start your thali</div>`;
  const stats=[['💪','Protein',T.p],['🌾','Carbohydrate',T.c]];
  /* "Know More" breakdown (phone): one row per dish, duplicates merged */
  const merged=new Map();
  L.forEach(([i,q])=>{const e=merged.get(i.id)||[i,0];e[1]+=q;merged.set(i.id,e)});
  const rows=[...merged.values()].map(([i,q])=>{const nn=nut(i);return `<li><span>${esc(i.name)}${q>1?' ×'+q:''}</span><span>${nn.p*q}g protein · ${nn.c*q}g carbs</span><span>${cur}${i.price*q}</span></li>`}).join('');
  $('#panel').innerHTML=`<h3>Your Thali</h3><div class="plate-wrap">${MANDALA}<div class="plate" style="${S.plateImg?`background-image:url(${S.plateImg})`:''}">${p}</div></div>
  <div class="macros">${stats.map(([ic,l,v])=>`<div class="mac"><span class="mi" aria-hidden="true">${ic}</span><div><small>${l}</small><b>${v} g</b></div></div>`).join('<span class="mdiv" aria-hidden="true"></span>')}<button class="kbtn ${know?'open':''}" data-act="know" aria-expanded="${know}" aria-label="Nutrition details">Know More ${ARROW}</button></div>
  <div class="know ${know?'open':''}"><ul>${rows||'<li class="none">Nothing added yet</li>'}</ul><div class="kt"><span>Total</span><b>${cur}${total}</b></div><button class="lnk" data-act="clear">Clear thali</button></div>
  <div class="tot"><span>Total</span><span>${cur}${total}</span></div><button class="btn" data-act="checkout" ${L.length?'':'disabled'}>Proceed to checkout ${ARROW}</button><button class="lnk" data-act="clear">Clear thali</button>`;
  const cb=$('#cbar');
  if(cb)cb.innerHTML=`<button class="btn" data-act="checkout" ${L.length?'':'disabled'}>Proceed to Checkout ${ARROW}</button>`;
  lastPop=null;
}

function drawMenu(reset){
  const C=CATEGORIES,S=SETTINGS,cur=S.cur||'₹';
  /* remember scroll positions so adding a dish doesn't jump the list back to the top */
  const oldG=$('#menu .grid'),oldT=$('#menu .tabs');
  const gs=oldG&&!reset?oldG.scrollTop:0,ts=oldT?oldT.scrollLeft:0;
  let h='',cat;
  if(guide!=null){
    const st=guide.steps[guide.i];
    cat=C.find(c=>c.id==st.cat);
    h+=`<div class="banner"><div><b>Step ${guide.i+1} of ${guide.steps.length}: ${esc(st.title)}</b><div class="hint">${esc(st.hint)}</div></div><div class="acts"><button class="btn alt" data-act="gback" ${guide.i?'':'disabled'}>Back</button><button class="btn" data-act="gnext">${guide.i==guide.steps.length-1?'Finish':'Next'}</button><button class="btn alt" data-act="gexit">Full menu</button></div></div>`;
  }else{
    if(!C.find(c=>c.id==active))active=C[0].id;
    cat=C.find(c=>c.id==active);
    h+=`<div class="tabs" role="tablist">${C.map(c=>`<button class="tab" role="tab" aria-selected="${c.id==active}" data-act="tab" data-id="${c.id}"><span class="ti" aria-hidden="true">${c.icon}</span><span class="tl-full">${esc(c.name)}</span><span class="tl-short">${esc(c.short)}</span></button>`).join('')}</div>`;
  }
  const items=getItems(cat.id),t=cat.type;
  h+=`<div class="grid">${items.map(it=>{
    const qty=t=='bread'?(cart.bread[it.id]||0):t=='rice'?(cart.rice==it.id?1:0):cart.bowls.filter(b=>b==it.id).length;
    const on=qty>0,nm=esc(it.name);
    let a;
    if(!it.available)a=`<button class="add" disabled>Sold out</button>`;
    else if(t=='bread')a=`<div class="step ${on?'':'zero'}"><button data-act="dec" data-id="${it.id}" aria-label="Remove one ${nm}">−</button><b>${qty}</b><button data-act="inc" data-id="${it.id}" aria-label="Add one ${nm}">+</button></div>${on?'':`<button class="add mb" data-act="inc" data-id="${it.id}" aria-label="Add ${nm}"><span class="pl">+ </span>Add</button>`}`;
    else if(t=='rice')a=`<button class="add ${on?'on':''}" data-act="rice" data-id="${it.id}">${on?'Remove':'<span class="pl">+ </span>Add'}</button>`;
    else a=`<button class="add dk ${on?'on':''}" data-act="bowl" data-id="${it.id}">${on?'Remove':'Add'}</button>`+(on?`<div class="step mb"><button data-act="bdec" data-id="${it.id}" aria-label="Remove one ${nm}">−</button><b>${qty}</b><button data-act="binc" data-id="${it.id}" aria-label="Add one ${nm}">+</button></div>`:`<button class="add mb" data-act="binc" data-id="${it.id}" aria-label="Add ${nm}"><span class="pl">+ </span>Add</button>`);
    return `<article class="card ${on?'sel':''}"><div class="bowl">${thumb(it)}</div><div class="nm"><span class="vg ${it.veg?'':'n'}" title="${it.veg?'Veg':'Non-veg'}"></span>${nm}</div><div class="pr">${cur}${it.price}</div>${it.description?`<div class="hint">${esc(it.description)}</div>`:''}${a}</article>`;
  }).join('')}</div>`;
  $('#menu').innerHTML=h;
  const g=$('#menu .grid');if(g&&gs)g.scrollTop=gs;
  const tb=$('#menu .tabs');
  if(tb){
    tb.scrollLeft=ts;
    /* when the category changes, bring the active tab to the centre of the tab bar */
    const el=$('.tab[aria-selected=true]',tb);
    if(reset&&el&&tb.scrollWidth>tb.clientWidth)tb.scrollTo({left:el.offsetLeft-(tb.clientWidth-el.offsetWidth)/2,behavior:'smooth'});
  }
}

function siteClick(act,el,e){
  const S=SETTINGS,max=+S.max||7,id=el.dataset.id,it=id&&getItem(id),c=it&&catOf(it);
  /* close the hamburger dropdown on any action other than toggling it */
  if(act!=='menu'){const nv=$('.nav');if(nv){nv.classList.remove('open');const mb=$('.menu-btn');if(mb)mb.setAttribute('aria-expanded','false')}}
  if(act!=='know')closeKnow();
  switch(act){
    case'menu':{
      const nv=$('.nav'),open=nv.classList.toggle('open');
      el.setAttribute('aria-expanded',open);
      return;
    }
    case'order':{
      if(e)e.preventDefault();
      const b=$('#builder');
      b.classList.remove('entering');
      void b.offsetWidth; // trigger reflow for fresh entrance animation
      b.classList.add('entering');
      const targetY=b.getBoundingClientRect().top+(window.scrollY||window.pageYOffset);
      smoothScrollTo(targetY,900);
      setTimeout(()=>b.classList.remove('entering'),1100);
      return;
    }
    case'top':{
      if(e)e.preventDefault();
      smoothScrollTo(0,800);
      return;
    }
    case'soon':return toast('This page is coming soon');
    case'theme':
      document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';
      try{localStorage.theme=document.documentElement.dataset.theme}catch(e){}
      return;
    case'know':know=!know;return drawPanel();
    case'tab':active=id;return drawMenu(true);
    case'guide':guide={i:0,steps:GUIDE};return drawMenu(true);
    case'gback':guide.i--;return drawMenu(true);
    case'gexit':guide=null;return drawMenu(true);
    case'gnext':
      if(guide.i>=guide.steps.length-1){guide=null;toast('Your thali is ready! Review it above.')}
      else guide.i++;
      return drawMenu(true);
    case'bowl':case'binc':{
      /* "bowl" = laptop toggle, "binc" = phone + button (a dish can be added more than once) */
      const k=act=='bowl'?cart.bowls.indexOf(id):-1;
      if(k>=0)cart.bowls.splice(k,1);
      else{
        if(cart.bowls.length>=max)return toast(`Your plate is full (${max} katoras). Remove one to add another.`);
        if(c.maxSelectable&&cart.bowls.filter(b=>getItem(b).categoryId==c.id).length>=c.maxSelectable)return toast(`You can pick up to ${c.maxSelectable} from ${c.name}.`);
        cart.bowls.push(id);lastPop=id;
      }
      break;
    }
    case'bdec':{const k=cart.bowls.lastIndexOf(id);if(k>=0)cart.bowls.splice(k,1);break}
    case'rice':if(cart.rice==id)cart.rice=null;else{cart.rice=id;lastPop=id}break;
    case'inc':
      if(c.maxSelectable&&Object.keys(cart.bread).filter(b=>getItem(b)&&getItem(b).categoryId==c.id).reduce((a,b)=>a+cart.bread[b],0)>=c.maxSelectable)return toast(`Up to ${c.maxSelectable} from ${c.name}.`);
      cart.bread[id]=(cart.bread[id]||0)+1;lastPop=id;break;
    case'dec':if(cart.bread[id]>0)cart.bread[id]--;break;
    case'clear':cart={bowls:[],rice:null,bread:{}};break;
    case'checkout':return toast('Checkout is coming soon – this is a placeholder.');
    default:return;
  }
  draw();
}

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el)siteClick(el.dataset.act,el,e);
  else if(know&&!e.target.closest('.know'))closeKnow(); /* tap anywhere else closes "Know More" */
});

try{document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}
site();
</script></body></html>
