<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annapurna – Ghar ka fresh khana</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbe9da;--bg2:#f6d9c0;--card:#fff8f1;--maroon:#8a2a1f;--maroon-d:#6f1f16;--ink:#3b1d16;--muted:#5a3a30;--line:rgba(138,42,31,.18);--chip:#f5dcc6;--brass:#b8873a;--serif:"Newsreader",Georgia,serif;--sans:"Outfit",system-ui,sans-serif;--pad:clamp(20px,5vw,80px)}
[data-theme=dark]{--bg:#1d1411;--bg2:#251915;--card:#32221c;--ink:#f5e4d6;--muted:#d1b5a4;--line:rgba(245,220,198,.2);--chip:#3f2b23;--maroon:#c4503f;--maroon-d:#a53f30}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--maroon);color:#fff;font-weight:500;border-radius:999px;min-height:44px;padding:0 26px;transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{background:var(--maroon-d);transform:translateY(-2px);box-shadow:0 10px 24px rgba(138,42,31,.28)}.btn.alt{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.lnk{text-decoration:underline;min-height:44px;color:var(--muted)}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hint{font-size:.85rem;color:var(--muted)}
/* HERO – colours are fixed to the light palette so dark mode doesn't affect it */
.hero{--bg:#fbe9da;--bg-deep:#f6d9c0;--maroon:#8a2a1f;--maroon-dark:#6f1f16;--ink:#3b1d16;--line:rgba(138,42,31,.15);--chip:#f5dcc6;--leaf:#5b6b32;
 position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;color:var(--ink);background:linear-gradient(100deg,#fdeee0 0%,var(--bg) 45%,var(--bg-deep) 100%)}
/* Laptop/tablet image: hero.png  |  Phone image: "phone hero.png" (same folder) */
.hero-media{position:absolute;inset:0;background:var(--hero-img,url("hero.png")) right bottom/cover no-repeat;z-index:0}
/* STEAM */
.steam{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.steam-m{display:none}
.wisp{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:rise 7s ease-out infinite}
.wm{animation-name:risem}
.w1{animation-delay:0s}
.w2{animation-delay:2.3s;animation-duration:8s}
.w3{animation-delay:4.6s;animation-duration:7.5s}
.w4{animation-delay:1.2s;animation-duration:6.5s}
.w5{animation-delay:3.4s;animation-duration:6.5s}
@keyframes rise{
  0%   {opacity:0;   transform:translateY(20px) scale(.7, .6)}
  20%  {opacity:.6}
  60%  {opacity:.38}
  100% {opacity:0;   transform:translateY(-120px) scale(1.7, 1.15)}
}
@keyframes risem{
  0%   {opacity:0;   transform:translateY(12px) scale(.7, .6)}
  20%  {opacity:.65}
  60%  {opacity:.4}
  100% {opacity:0;   transform:translateY(-70px) scale(1.6, 1.15)}
}
@media(prefers-reduced-motion:reduce){.wisp{animation:none;opacity:.2}}
.nav{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:0 var(--pad);padding:22px 0;border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.75rem;font-weight:500;color:var(--maroon-dark)}.logo svg,.logo img{width:40px;height:40px;object-fit:contain}
.links{display:flex;gap:clamp(24px,3.4vw,52px);list-style:none}
.links button{font-size:1rem;font-weight:500;padding:8px 2px;position:relative;min-height:44px;color:var(--ink)}
.links button::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:2px;background:var(--maroon);transform:scaleX(0);transition:transform .25s;transform-origin:left}.links button:hover::after{transform:scaleX(1)}
.nav .btn{justify-self:end}
/* hamburger (phone / small tablet only) */
.menu-btn{display:none;justify-self:end;width:44px;height:44px;align-items:center;justify-content:center;color:var(--maroon)}
.menu-btn svg{width:32px;height:32px}
.mnav{display:none;position:absolute;top:100%;right:0;margin-top:8px;min-width:200px;flex-direction:column;background:#fff8f1;border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 14px 30px rgba(138,42,31,.16)}
.mnav button{min-height:46px;padding:0 16px;text-align:left;font-weight:500;color:var(--ink);border-radius:12px}
.mnav button:hover{background:var(--chip)}
.nav.open .mnav{display:flex}
.btn-sm{padding:0 30px;font-size:1rem}.btn-lg{padding:20px 38px;font-size:1.2rem;gap:14px}
.btn svg{width:24px;height:24px;transition:transform .2s}.btn:hover svg{transform:translateX(4px)}
.content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;margin:0 var(--pad);padding:clamp(32px,6vh,72px) 0 clamp(48px,8vh,96px);max-width:720px}
h1{font-family:var(--serif);font-weight:600;color:var(--maroon);font-size:clamp(3.2rem,7.2vw,6.4rem);line-height:1.02;letter-spacing:-.02em}
.sub{position:relative;display:inline-block;align-self:flex-start;font-family:var(--serif);font-style:italic;font-weight:400;color:var(--maroon);font-size:clamp(1.6rem,3.2vw,2.6rem);margin-top:clamp(14px,2.4vh,26px)}
.sub svg{position:absolute;left:38%;right:0;bottom:-14px;width:62%;height:14px}
.features{display:flex;align-items:center;gap:clamp(18px,2.4vw,36px);margin-top:clamp(32px,6vh,56px);flex-wrap:wrap}
.feature{display:flex;align-items:center;gap:16px;font-size:1.05rem;line-height:1.35;color:var(--ink)}
.feature .ic{flex:none;width:60px;height:60px;border-radius:50%;background:var(--chip);display:grid;place-items:center}.feature .ic svg{width:30px;height:30px}
.divider{width:1px;height:52px;background:var(--line)}.cta{margin-top:clamp(32px,6vh,52px);align-self:flex-start}
@media(max-width:960px){.nav{grid-template-columns:1fr auto auto}.links{display:none}.menu-btn{display:inline-flex}.hero-media{background-position:75% bottom}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(251,233,218,.92) 0%,rgba(251,233,218,.6) 55%,rgba(251,233,218,0) 100%);z-index:0;pointer-events:none}.divider{display:none}}

/* ===== PHONE HERO – matches the mobile UI mock ===== */
@media(max-width:640px){
  .hero{min-height:100vh;min-height:100svh}
  .hero-media{background:var(--hero-img-m,url("phone hero.png")) center bottom/cover no-repeat}
  .hero::after{display:none}
  .steam-d{display:none}
  .steam-m{display:block}
  .nav{margin:0;padding:16px 20px;grid-template-columns:1fr auto}
  .nav>.btn-sm{display:none}
  .mnav{right:12px}
  .logo{font-size:1.55rem;gap:8px}.logo svg,.logo img{width:34px;height:34px}
  .content{max-width:none;margin:0;padding:clamp(28px,6.5vh,60px) 20px 0;justify-content:flex-start;flex:none}
  h1{font-size:clamp(3rem,13.6vw,4.2rem);line-height:1}
  .sub{font-size:clamp(1.4rem,6.6vw,2rem);margin-top:clamp(14px,2.4vh,22px)}
  .sub svg{bottom:-12px;height:12px}
  .features{flex-wrap:nowrap;flex-direction:row;align-items:center;gap:clamp(10px,3vw,18px);margin-top:clamp(28px,4.6vh,44px)}
  .feature{gap:10px;font-size:clamp(.78rem,3.5vw,.98rem);line-height:1.3}
  .feature .ic{width:clamp(40px,11vw,52px);height:clamp(40px,11vw,52px)}
  .feature .ic svg{width:55%;height:55%}
  .divider{display:block;height:40px;flex:none}
  .btn-lg{padding:0 30px;min-height:54px;font-size:1.1rem;gap:12px}
  .btn-lg svg{width:22px;height:22px}
  .cta{width:auto;margin-top:clamp(24px,4vh,40px)}
}
@media(max-width:380px){.logo{font-size:1.35rem}.feature{font-size:.74rem}}

/* ===== BUILDER (ORDER SECTION) – Solid Dark Color, No Background Image ===== */
#builder{
  background:#1f130e;
  color:#f5e4d6;
  padding:28px var(--pad) 140px;
  min-height:100vh;
  max-width:100%;
  overflow:hidden;
  scroll-margin-top:0;
}

/* Smooth entrance transition when clicking Order Now */
@keyframes sectionReveal{
  from{opacity:0;transform:translateY(28px)}
  to{opacity:1;transform:translateY(0)}
}
#builder.entering .bnav,
#builder.entering .panel,
#builder.entering #menu{
  animation:sectionReveal .75s cubic-bezier(.22,1,.36,1) both;
}
#builder.entering .panel{animation-delay:.12s}
#builder.entering #menu{animation-delay:.22s}

/* Top bar: Build Your Thali on top-left, Annapurna logo (icon only) on top-right */
.bnav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:4px 0 20px;
  margin-bottom:16px;
}
.bnav h2{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(2rem,5vw,3rem);
  color:#f5e4d6;
  margin:0;
  line-height:1.05;
}
.bnav .logo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.bnav .logo svg,.bnav .logo img{
  width:44px;
  height:44px;
  object-fit:contain;
  display:block;
}

.cols{
  display:grid;
  grid-template-columns:minmax(320px,460px) minmax(0,1fr);
  gap:36px;
  align-items:start;
  max-width:100%;
}
.panel{
  position:sticky;
  top:16px;
  background:none;
  border:0;
  padding:0;
  min-width:0;
}
#menu{min-width:0;max-width:100%}

/* Left column larger thali, right column Protein & Carbohydrates */
.thali-top{
  display:grid;
  grid-template-columns:1.38fr 1fr;
  align-items:center;
  gap:20px;
  width:100%;
}
.plate-wrap{position:relative;width:100%;max-width:300px;margin:0 auto}
.plate{position:relative;width:100%;aspect-ratio:1;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#e8c27a 0 48%,#c9a04f 52%,#8c6428 100%) center/cover;box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 0 0 6px rgba(255,240,200,.45)}
.d{position:absolute;aspect-ratio:1;overflow:visible}
.d>img,.d>i{width:100%;height:100%;display:block}
.d>img{object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.d>i{border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.d.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.2);opacity:0}}
.badge{position:absolute;right:-4px;top:-4px;background:var(--maroon);color:#fff;border-radius:99px;min-width:24px;height:24px;font-size:.8rem;display:grid;place-items:center;z-index:3}
.empty{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-style:italic;color:#fff;font-size:.95rem;padding:20%;text-align:center}

/* Right column nutrition details */
.macros{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:22px;
  padding:10px 0 10px 18px;
  border-left:1px solid rgba(245,228,214,.16);
  min-width:0;
}
.mac{display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.mac .mi{width:34px;height:34px;color:#d8973c;flex:none;display:grid;place-items:center}
.mac .mi svg{width:100%;height:100%;display:block}
.mac small{display:block;font-size:.85rem;color:#c9b2a3;margin-bottom:2px}
.mac b{font-size:1.65rem;font-weight:600;line-height:1.05;color:#fff;display:block;white-space:nowrap}

/* Category Tabs (kept as-is) */
.tabs{
  display:flex;
  gap:8px;
  flex-wrap:nowrap;
  overflow-x:auto;
  margin-bottom:18px;
  padding:4px 0;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  max-width:100%;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:42px;
  padding:0 16px;
  border-radius:999px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(245,228,214,.14);
  color:#e7d4c5;
  font-size:.9rem;
  font-weight:500;
  transition:background .25s,color .25s;
}
.ti{display:block}.ti svg{display:block;width:18px;height:18px}
.tl-full{display:none}.tl-short{display:inline}
.tab[aria-selected=true]{
  padding:0 18px;
  background:linear-gradient(#b8432f,#942e1f);
  border-color:transparent;
  color:#fff;
  box-shadow:0 6px 14px rgba(138,42,31,.32);
}

/* 2-Column Food Item Cards:
   Left column: food SVG
   Right column: food name at top, price below it, and + button to the right of the price */
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  align-content:start;
  width:100%;
}
.card{
  position:relative;
  background:#2b1b15;
  border:1.5px solid rgba(245,228,214,.13);
  border-radius:16px;
  padding:10px;
  display:grid;
  grid-template-columns:56px minmax(0,1fr);
  gap:10px;
  align-items:center;
  text-align:left;
  min-width:0;
  transition:border-color .2s,box-shadow .2s;
}
.card.sel{
  border-color:#d9824b;
  box-shadow:0 0 0 1px rgba(217,130,75,.3);
}
.bowl{
  width:56px;
  height:56px;
  aspect-ratio:1;
  flex:none;
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.32));
}
.bowl>img,.bowl>i{width:100%;height:100%;display:block}
.bowl>img{object-fit:contain}
.bowl>i{border-radius:50%}
i.ph{background:var(--c)}

.cinfo{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:6px;
  min-width:0;
}
.nm{
  font-weight:500;
  font-size:.9rem;
  line-height:1.2;
  color:#f5e4d6;
  overflow-wrap:break-word;
}
.cfoot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  margin-top:auto;
}
.pr{
  color:#e7d4c5;
  font-weight:500;
  font-size:.92rem;
  white-space:nowrap;
}
.add-cir{
  width:26px;
  height:26px;
  border-radius:50%;
  background:#f3e1d3;
  color:#2b1812;
  font-size:1.15rem;
  font-weight:500;
  display:grid;
  place-items:center;
  line-height:1;
  flex:none;
  transition:transform .15s,background .2s;
}
.add-cir:hover{transform:scale(1.06);background:#ead0bc}
.step{
  display:inline-flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  height:26px;
  padding:0 6px;
  border-radius:999px;
  background:linear-gradient(#b8432f,#9e3322);
  color:#fff;
  font-weight:500;
  min-width:58px;
  flex:none;
}
.step button{
  width:14px;
  height:14px;
  display:grid;
  place-items:center;
  color:#fff;
  font-size:.95rem;
  line-height:1;
}
.step b{font-size:.8rem;font-weight:600}

/* Bottom Checkout Dock: Total beside the word Total on left, Continue button on right */
.cbar{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%) translateY(130%);
  width:min(calc(100% - 24px),900px);
  z-index:30;
  padding:14px 20px;
  border-radius:24px;
  background:#281914;
  border:1px solid rgba(245,228,214,.14);
  box-shadow:0 14px 34px rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  opacity:0;
  pointer-events:none;
  transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .25s;
}
.cbar.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.cbar-tot{
  display:flex;
  align-items:baseline;
  gap:10px;
  padding-right:16px;
  border-right:1px solid rgba(245,228,214,.14);
}
.cbar-tot span{font-size:.98rem;color:#c9b2a3;font-weight:400}
.cbar-tot b{font-size:1.55rem;font-weight:600;color:#fff;line-height:1}
.cbar .btn{
  min-height:48px;
  padding:0 26px;
  font-size:1.05rem;
  border-radius:999px;
  background:linear-gradient(90deg,#b8432f,#9e3322);
  color:#fff;
  box-shadow:0 8px 20px rgba(158,51,34,.35);
}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#f5e4d6;color:#1f130e;padding:12px 20px;border-radius:99px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}#toast.on{opacity:1}

@media(max-width:920px){
  .cols{grid-template-columns:minmax(0,1fr);gap:20px}
  .panel{position:relative;top:auto}
}

/* ===== PHONE ORDER SECTION ===== */
@media(max-width:640px){
  #builder{
    padding:16px 14px 116px;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
  }
  .bnav{margin:0 0 10px;padding:4px 0}
  .bnav h2{font-size:clamp(1.75rem,7.2vw,2.2rem)}
  .bnav .logo svg,.bnav .logo img{width:38px;height:38px}

  .cols{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0;width:100%}
  .thali-top{grid-template-columns:1.35fr 1fr;gap:14px}
  .plate-wrap{max-width:none}
  .empty{font-size:.78rem;padding:18%}

  .macros{gap:18px;padding:8px 0 8px 14px}
  .mac{gap:10px}
  .mac .mi{width:28px;height:28px}
  .mac small{font-size:.78rem}
  .mac b{font-size:1.45rem}

  #menu{display:flex;flex-direction:column;flex:1;min-height:0;width:100%}
  .tabs{margin:0 0 14px;padding:2px 0}

  .grid{gap:10px}
  .card{
    grid-template-columns:52px minmax(0,1fr);
    padding:9px;
    gap:8px;
    border-radius:14px;
  }
  .bowl{width:52px;height:52px}
  .nm{font-size:.82rem;line-height:1.18}
  .pr{font-size:.88rem}
  .add-cir{width:24px;height:24px;font-size:1.1rem}
  .step{height:24px;min-width:54px;padding:0 5px;gap:3px}
  .step button{width:13px;height:13px;font-size:.9rem}
  .step b{font-size:.76rem}

  .cbar{
    left:12px;
    right:12px;
    bottom:calc(10px + env(safe-area-inset-bottom,0px));
    transform:translateY(130%);
    width:auto;
    padding:12px 16px;
  }
  .cbar.show{transform:translateY(0)}
}

@media(max-width:360px){
  .grid{gap:8px}
  .card{grid-template-columns:44px minmax(0,1fr);padding:8px;gap:6px}
  .bowl{width:44px;height:44px}
  .nm{font-size:.76rem}
  .pr{font-size:.82rem}
  .cbar-tot b{font-size:1.3rem}
  .cbar .btn{padding:0 18px;font-size:.95rem}
}

/* ===== LAPTOP ORDER SECTION (>960px) ===== */
.ptitle,.pfoot,.vd{display:none}
@media(min-width:961px){
  #builder{padding-top:18px}
  .bnav{border-bottom:1px solid rgba(245,228,214,.14);margin-bottom:26px;padding:4px 0 18px}
  .cols{grid-template-columns:minmax(340px,420px) minmax(0,1fr);gap:32px}

  /* left: Your Thali card */
  .panel{background:#2b1b15;border:1px solid rgba(245,228,214,.13);border-radius:28px;padding:22px 26px 20px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
  .ptitle{display:block;text-align:center;font-family:var(--serif);font-weight:600;font-size:1.6rem;color:#f5e4d6;margin-bottom:14px}
  .thali-top{display:block}
  .plate-wrap{max-width:280px}
  .macros{flex-direction:row;justify-content:center;gap:0;border-left:0;padding:18px 0 16px;border-bottom:1px solid rgba(245,228,214,.14)}
  .mac+.mac{border-left:1px solid rgba(245,228,214,.16);margin-left:24px;padding-left:24px}
  .mac b{font-size:1.5rem}
  .pfoot{display:block}
  .ptotal{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 14px}

</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script>
/* Optional: paste a full "data:image/jpeg;base64,..." string to embed the hero images.
   If left empty, hero.png (laptop) and "phone hero.png" (phone) from the same folder are used. */
const HERO="";
const HERO_MOBILE="";

/* ============ Helpers ============ */
const $=(s,r=document)=>r.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)};
const hue=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7)%360;

/* Custom smooth scroll with cubic ease-in-out so it never snaps instantly */
let scrollAnimId=null;
function smoothScrollTo(targetY,duration=850){
  if(scrollAnimId)cancelAnimationFrame(scrollAnimId);
  const startY=window.scrollY||window.pageYOffset;
  const diff=targetY-startY;
  if(Math.abs(diff)<2)return;
  let startTime=null;
  const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

  function step(timestamp){
    if(!startTime)startTime=timestamp;
    const elapsed=timestamp-startTime;
    const progress=Math.min(elapsed/duration,1);
    window.scrollTo({top:startY+diff*easeInOutCubic(progress),behavior:'instant'});
    if(progress<1){
      scrollAnimId=requestAnimationFrame(step);
    }else{
      scrollAnimId=null;
    }
  }
  scrollAnimId=requestAnimationFrame(step);
}

/* Direct SVG URL resolver: maps dish name -> "<Dish Name>.svg" in the same folder.
   Replaces "/" with a space so "Millet/Quinoa" looks for "MilletQuinoa.svg". */
const svgPath=name=>encodeURI(`${String(name||'').trim().replace(/\//g,' ')}.svg`);

/* ============ STATIC MENU DATA ============ */
const SETTINGS={name:'Annapurna',logo:null,plateImg:null,max:7,cur:'₹'};

const RAW_MENU=[

  ['Raita & Salads','bowl',['Plain Dahi:40','Boondi Raita:50','Kachumber:50','Green Salad:50']],
  ['Chutneys & Pickles','bowl',['Mint Chutney:20','Tamatar Chutney:25','Mango Pickle:20','Cirke wala Pyaj:25']],
  ['Rice & Millets','rice',['Steamed Rice:70','Lemon Rice:90','Millet/Quinoa:110']],
  ['Rotis & Breads','bread',['Tikona Paratha:30','Millet Roti:25','Phulka:15','Sabudana Papad:20']]
];

/* Short labels + icons used by the tab bar (same order as RAW_MENU) */
const SHORT=['Sabzi','Dal','Raita','Chutney','Rice','Roti'];
const ICO=b=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const TAB_ICONS=[
  ICO('<path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M9 8c0-1.2 1-1.2 1-2.5M14 8c0-1.2 1-1.2 1-2.5"/>'),
  ICO('<circle cx="9" cy="13" r="4.5"/><circle cx="15.5" cy="10" r="3.5"/>'),

  ICO('<path d="M8 4h8M9 4v3M15 4v3"/><path d="M7 7h10l1 12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/>'),

const CATEGORIES=[];
const ITEMS=[];
RAW_MENU.forEach(([name,type,its],ci)=>{
  const id='c'+ci;
  CATEGORIES.push({id,name,type,order:ci,short:SHORT[ci]||name,icon:TAB_ICONS[ci]||TAB_ICONS[0]});
  its.forEach((s,i)=>{
    const[n,p]=s.split(':');
    ITEMS.push({id:id+'i'+i,categoryId:id,name:n,price:+p,description:'',veg:true,available:true,order:i});
  });
});

/* Nutrition per serving in grams: [protein, carbs] */
const NUTR={
  'Paneer Palak':[12,9],'Gobi ki Sabzi':[4,12],'Bhindi Fry':[3,10],'Matar Mushroom':[6,14],
  'Stuffed Capsicum':[5,30],'Jeera Aloo':[3,26],'Dal Tadka':[9,20],'Dal Makhani':[11,24],
  'Plain Dahi':[4,5],'Boondi Raita':[4,9],'Kachumber':[1,6],'Green Salad':[1,5],
  'Mint Chutney':[0,2],'Tamatar Chutney':[0,4],'Mango Pickle':[0,3],'Cirke wala Pyaj':[0,3],
  'Steamed Rice':[4,45],'Lemon Rice':[5,48],'Millet/Quinoa':[7,38],
  'Tikona Paratha':[4,22],'Millet Roti':[3,18],'Phulka':[3,15],'Sabudana Papad':[0,8]
};
const nut=it=>{const n=NUTR[it.name]||[0,0];return{p:it.protein??n[0],c:it.carbs??n[1]}};

/* ============ Customer site ============ */
let cart={bowls:[],rice:null,bread:{}},active=CATEGORIES[0].id,lastPop=null;
const getItem=id=>ITEMS.find(i=>i.id==id);
const getItems=catId=>ITEMS.filter(i=>!catId||i.categoryId==catId);
const catOf=it=>CATEGORIES.find(c=>c.id==it.categoryId);

/* Renders `<img src="Dish Name.svg">` and falls back to colored circle if SVG file isn't found */
const thumb=it=>`<img src="${svgPath(it.name)}" alt="${esc(it.name)}" onerror="this.outerHTML='<i class=\\'ph\\' style=\\'--c:hsl(${hue(it.name)},55%,58%)\\'></i>'">`;

const LOTUS=`<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 8c3 4 5 9 5 15 0 5-2 9-5 12-3-3-5-7-5-12 0-6 2-11 5-15z" fill="#f7b9c4" stroke="#d6566f" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 33C12 32 6 27 4 19c6 0 12 3 15 9M29 33c7-1 13-6 15-14-6 0 12 3-15 9" fill="#f9cdd5" stroke="#d6566f" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 37c-5 0-9-3-11-8 5-1 9 1 12 5M33 37c5 0 9-3 11-8-5-1-9 1-12 5" stroke="#d6566f" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const ARROW=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h17M14 6l6 6-6 6"/></svg>`;
const BURGER=`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 9h24M4 16h24M4 23h24"/></svg>`;
const IC_PROT=`<svg viewBox="0 0 36 36" fill="currentColor" aria-hidden="true"><path d="M14.5 7.5c-2.2 0-4 1.6-4.3 3.7l-1.9 12.2c-.5 3.3 2 6.3 5.3 6.3h10.9c4 0 7.2-3.2 7.2-7.2 0-3.7-2.8-6.8-6.4-7.1-1.9-.2-3.6.5-4.8 1.7l.7-4.5c.3-1.6-.8-3.1-2.4-3.4l-4.3-.7z"/></svg>`;
const IC_CARB=`<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 29C14 21 20 14 27 8"/><path d="M16 22c-2.5-1-4-3.5-3.5-6.5 3 .5 5.5 2 6.5 4.5"/><path d="M20 17c-2.5-1-4-3.5-3.5-6.5 3 .5 5.5 2 6.5 4.5"/><path d="M22 21c2.5-1 5-.5 7 1.5-2 2-4.5 2.5-7 1.5"/><path d="M17 26c2.5-1 5-.5 7 1.5-2 2-4.5 2.5-7 1.5"/></svg>`;

function site(){
  const S=SETTINGS;
  app.innerHTML=`<header class="hero"><div class="hero-media" role="img" aria-label="Steel thali with dal, sabzi, rice and roti"></div>
  <!-- Laptop / tablet steam -->
  <svg class="steam steam-d" viewBox="0 0 1910 963" preserveAspectRatio="xMaxYMax slice" aria-hidden="true"><defs><filter id="wisp" filterUnits="userSpaceOnUse" x="1000" y="60" width="700" height="520" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.010 0.022" numOctaves="3" seed="7" result="noise"><animate attributeName="baseFrequency" dur="16s" values="0.010 0.022;0.015 0.030;0.010 0.022" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="14"/></filter></defs>

    <g transform="translate(1265 490)"><path class="wisp w2" stroke-width="46" d="M0 0C-50-45 50-90 0-135S-50-210 0-260"/></g>
    <g transform="translate(1360 495)"><path class="wisp w3" stroke-width="50" d="M0 0C45-55-45-105 0-155S45-225 0-280"/></g>
    <g transform="translate(1160 585)"><path class="wisp w4" stroke-width="40" d="M0 0C40-40-40-80 0-120S40-170 0-210"/></g>

  </g></svg>
  <!-- Phone steam -->
  <svg class="steam steam-m" viewBox="0 0 941 1672" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><filter id="wispm" filterUnits="userSpaceOnUse" x="0" y="820" width="941" height="640" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.014 0.030" numOctaves="3" seed="11" result="noise"><animate attributeName="baseFrequency" dur="14s" values="0.014 0.030;0.020 0.040;0.014 0.030" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="44" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="8"/></filter></defs>
  <g filter="url(#wispm)" fill="none" stroke="#fff" stroke-linecap="round">
    <g transform="translate(430 1185)"><path class="wisp wm w1" stroke-width="30" d="M0 0C28-25-28-50 0-75S28-115 0-150"/></g>
    <g transform="translate(262 1262)"><path class="wisp wm w2" stroke-width="26" d="M0 0C-25-22 25-45 0-68S-25-105 0-135"/></g>
    <g transform="translate(490 1372)"><path class="wisp wm w3" stroke-width="28" d="M0 0C24-26-24-52 0-78S24-118 0-145"/></g>
    <g transform="translate(655 1222)"><path class="wisp wm w4" stroke-width="26" d="M0 0C22-22-22-44 0-66S22-98 0-130"/></g>
    <g transform="translate(560 1255)"><path class="wisp wm w5" stroke-width="24" d="M0 0C-22-22 22-44 0-66S-22-98 0-125"/></g>
  </g></svg>
  <nav class="nav" aria-label="Main"><a href="#top" data-act="top" class="logo" aria-label="${esc(S.name)} home">${S.logo?`<img src="${S.logo}" alt="">`:LOTUS}${esc(S.name)}</a>
  <ul class="links"><li><button data-act="soon">Our Story</button></li><li><button data-act="order">Menu</button></li><li><button data-act="soon">Kitchens</button></li><li><button data-act="soon">Plans</button></li></ul>
  <button class="btn btn-sm" data-act="order">Order Now</button>
  <button class="menu-btn" data-act="menu" aria-label="Open menu" aria-expanded="false" aria-controls="mnav">${BURGER}</button>
  <div class="mnav" id="mnav"><button data-act="soon">Our Story</button><button data-act="order">Menu</button><button data-act="soon">Kitchens</button><button data-act="soon">Plans</button><button data-act="order">Order Now</button></div></nav>
  <div class="content"><h1>Ghar ka<br>fresh khana.</h1><p class="sub">Delivering in 10 minutes.<svg viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true"><path d="M2 10C80 4 190 3 298 8" stroke="#d9a07f" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg></p>
  <div class="features"><div class="feature"><span class="ic"><svg viewBox="0 0 32 32" fill="none" stroke="#8a2a1f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 9c-1-1.5 1-2.5 0-4M16 9c-1-1.5 1-2.5 0-4M21 9c-1-1.5 1-2.5 0-4"/><path d="M5 15h22v2a9 9 0 0 1-9 9h-4a9 9 0 0 1-9-9v-2z"/><path d="M5 17H2.5M27 17h2.5"/></svg></span><span>Food prepared<br>within 30 minutes</span></div><span class="divider" aria-hidden="true"></span>
  <div class="feature"><span class="ic"><svg viewBox="0 0 32 32" fill="none" stroke="#5b6b32" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 26C4 14 12 5 26 5c0 13-8 21-18 21z"/><path d="M6 26C11 19 16 14 21 11M13 20l4 .5M16 16l4-.5"/></svg></span><span>Fresh,<br>quality ingredients</span></div></div>
  <button class="btn btn-lg cta" data-act="order">Order Now ${ARROW}</button></div></header>
  <section id="builder" aria-label="Build your thali">
    <div class="bnav">
      <h2>Build Your Thali</h2>
      <a href="#top" data-act="top" class="logo" aria-label="${esc(S.name)} home">${S.logo?`<img src="${S.logo}" alt="">`:LOTUS}</a>
    </div>
    <div class="cols">
      <aside class="panel" id="panel" aria-label="Your thali"></aside>

  </section>`;
  const hm=$('.hero-media');
  if(HERO)hm.style.setProperty('--hero-img',`url("${HERO}")`);

/* Show the sticky checkout bar while the order section is visible */
function syncBar(){
  const b=$('#builder'),c=$('#cbar');
  if(!b||!c)return;
  const r=b.getBoundingClientRect();
  c.classList.toggle('show',r.top<innerHeight*.65&&r.bottom>120);
}
addEventListener('scroll',syncBar,{passive:true});
addEventListener('resize',syncBar);

const draw=()=>{if(!$('#panel'))return;drawPanel();drawMenu()};
const disc=(it,sz,x,y,cls,k)=>`<span class="d ${cls} ${lastPop==it.id+(k||'')?'pop':''}" style="width:${sz}%;left:${x-sz/2}%;top:${y-sz/2}%">${thumb(it)}</span>`;

function lines(){
  const L=[];
  cart.bowls=cart.bowls.filter(id=>getItem(id)&&getItem(id).available);
  if(cart.rice&&!(getItem(cart.rice)&&getItem(cart.rice).available))cart.rice=null;
  cart.bowls.forEach(id=>L.push([getItem(id),1]));
  if(cart.rice)L.push([getItem(cart.rice),1]);
  for(const id in cart.bread){
    if(getItem(id)&&getItem(id).available&&cart.bread[id]>0)L.push([getItem(id),cart.bread[id]]);
    else delete cart.bread[id];
  }
  return L;
}

function drawPanel(){
  const S=SETTINGS,max=+S.max||7,L=lines(),cur=S.cur||'₹',total=L.reduce((a,[i,q])=>a+i.price*q,0);
  let p='';
  const T=L.reduce((a,[i,q])=>{const n=nut(i);a.p+=n.p*q;a.c+=n.c*q;return a},{p:0,c:0});
  /* bigger katoras: 26% discs on a ring of radius 37% */
  cart.bowls.forEach((id,i)=>{const a=i/max*2*Math.PI-Math.PI/2;p+=disc(getItem(id),26,50+37*Math.cos(a),50+37*Math.sin(a),'k')});
  if(cart.rice)p+=disc(getItem(cart.rice),25,39,50,'r');
  const bk=Object.keys(cart.bread),n=bk.reduce((a,k)=>a+cart.bread[k],0);
  if(n){
    const m=Math.min(3,n);
    for(let j=0;j<m;j++)p+=disc(getItem(bk[j%bk.length]),25,61+(j-(m-1)/2)*3.5,50-(j-(m-1)/2)*3.5,'b',bk[j%bk.length]);
    p+=`<span class="badge" style="position:absolute;left:72%;top:34%">${n}</span>`;
  }
  if(!L.length)p+=`<div class="empty">Tap a dish to start your thali</div>`;
  const stats=[[IC_PROT,'Protein',T.p],[IC_CARB,'Carbohydrates',T.c]];
  $('#panel').innerHTML=`<div class="thali-top">
    <div class="plate-wrap"><div class="plate" style="${S.plateImg?`background-image:url(${S.plateImg})`:''}">${p}</div></div>
    <div class="macros">${stats.map(([ic,l,v])=>`<div class="mac"><span class="mi" aria-hidden="true">${ic}</span><div><small>${l}</small><b>${v} g</b></div></div>`).join('')}</div>
  </div>
  <div class="pfoot"><div class="ptotal"><span>Total</span><b>${cur}${total}</b></div><button class="btn pcheck" data-act="checkout" ${L.length?'':'disabled'}>Proceed to checkout ${ARROW}</button><button class="lnk pclear" data-act="clear">Clear thali</button></div>`;
  const cb=$('#cbar');
  if(cb)cb.innerHTML=`<div class="cbar-tot"><span>Total</span><b>${cur}${total}</b></div><button class="btn" data-act="checkout" ${L.length?'':'disabled'}>Continue ${ARROW}</button>`;
  lastPop=null;
}

function drawMenu(reset){
  const C=CATEGORIES,S=SETTINGS,cur=S.cur||'₹';
  /* remember scroll positions so adding a dish doesn't jump the list back to the top */
  const oldG=$('#menu .grid'),oldT=$('#menu .tabs');
  const gs=oldG&&!reset?oldG.scrollTop:0,ts=oldT?oldT.scrollLeft:0;
  if(!C.find(c=>c.id==active))active=C[0].id;
  const cat=C.find(c=>c.id==active);
  let h=`<div class="tabs" role="tablist">${C.map(c=>`<button class="tab" role="tab" aria-selected="${c.id==active}" data-act="tab" data-id="${c.id}"><span class="ti" aria-hidden="true">${c.icon}</span><span class="tl-full">${esc(c.name)}</span><span class="tl-short">${esc(c.short)}</span></button>`).join('')}</div>`;
  const items=getItems(cat.id),t=cat.type;
  h+=`<div class="grid">${items.map(it=>{
    const qty=t=='bread'?(cart.bread[it.id]||0):t=='rice'?(cart.rice==it.id?1:0):cart.bowls.filter(b=>b==it.id).length;
    const on=qty>0,nm=esc(it.name);
    const incAct=t=='bread'?'inc':t=='rice'?'rice':'binc';
    const decAct=t=='bread'?'dec':t=='rice'?'rice':'bdec';
    let a;
    if(!it.available)a=`<button class="add-cir" disabled title="Sold out">×</button>`;
    else if(on)a=`<div class="step"><button data-act="${decAct}" data-id="${it.id}" aria-label="Remove one ${nm}">−</button><b>${qty}</b><button data-act="${incAct}" data-id="${it.id}" aria-label="Add one ${nm}">+</button></div>`;
    else a=`<button class="add-cir" data-act="${incAct}" data-id="${it.id}" aria-label="Add ${nm}">+</button>`;
    return `<article class="card ${on?'sel':''}"><div class="bowl">${thumb(it)}</div><div class="cinfo"><div class="nm"><span class="vd"></span>${nm}</div><div class="cfoot"><div class="pr">${cur}${it.price}</div>${a}</div></div></article>`;
  }).join('')}</div>`;
  $('#menu').innerHTML=h;
  const g=$('#menu .grid');if(g&&gs)g.scrollTop=gs;
  const tb=$('#menu .tabs');
  if(tb){
    tb.scrollLeft=ts;
    /* when the category changes, bring the active tab to the centre of the tab bar */
    const el=$('.tab[aria-selected=true]',tb);
    if(reset&&el&&tb.scrollWidth>tb.clientWidth)tb.scrollTo({left:el.offsetLeft-(tb.clientWidth-el.offsetWidth)/2,behavior:'smooth'});
  }
}

function siteClick(act,el,e){
  const S=SETTINGS,max=+S.max||7,id=el.dataset.id,it=id&&getItem(id),c=it&&catOf(it);
  /* close the hamburger dropdown on any action other than toggling it */
  if(act!=='menu'){const nv=$('.nav');if(nv){nv.classList.remove('open');const mb=$('.menu-btn');if(mb)mb.setAttribute('aria-expanded','false')}}
  switch(act){
    case'menu':{
      const nv=$('.nav'),open=nv.classList.toggle('open');
      el.setAttribute('aria-expanded',open);
      return;
    }
    case'order':{
      if(e)e.preventDefault();
      const b=$('#builder');
      b.classList.remove('entering');
      void b.offsetWidth;
      b.classList.add('entering');
      const targetY=b.getBoundingClientRect().top+(window.scrollY||window.pageYOffset);
      smoothScrollTo(targetY,900);
      setTimeout(()=>b.classList.remove('entering'),1100);
      return;
    }
    case'top':{
      if(e)e.preventDefault();
      smoothScrollTo(0,800);
      return;
    }
    case'soon':return toast('This page is coming soon');
    case'tab':active=id;return drawMenu(true);
    case'bowl':case'binc':{
      if(cart.bowls.length>=max)return toast(`Your plate is full (${max} katoras). Remove one to add another.`);
      if(c.maxSelectable&&cart.bowls.filter(b=>getItem(b).categoryId==c.id).length>=c.maxSelectable)return toast(`You can pick up to ${c.maxSelectable} from ${c.name}.`);
      cart.bowls.push(id);lastPop=id;
      break;
    }
    case'bdec':{const k=cart.bowls.lastIndexOf(id);if(k>=0)cart.bowls.splice(k,1);break}
    case'rice':if(cart.rice==id)cart.rice=null;else{cart.rice=id;lastPop=id}break;
    case'inc':
      if(c.maxSelectable&&Object.keys(cart.bread).filter(b=>getItem(b)&&getItem(b).categoryId==c.id).reduce((a,b)=>a+cart.bread[b],0)>=c.maxSelectable)return toast(`Up to ${c.maxSelectable} from ${c.name}.`);
      cart.bread[id]=(cart.bread[id]||0)+1;lastPop=id;break;
    case'dec':if(cart.bread[id]>0)cart.bread[id]--;break;
    case'clear':cart={bowls:[],rice:null,bread:{}};break;
    case'checkout':return toast('Checkout is coming soon – this is a placeholder.');
    default:return;
  }
  draw();
}

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el)siteClick(el.dataset.act,el,e);
});

try{document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}
site();
</script></body></html>
